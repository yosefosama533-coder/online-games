name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OnlineGames-Android-TWA-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project and enforce Play package ID
        shell: bash
        run: |
          set -euo pipefail
          unzip -q OnlineGames-Android-TWA-project.zip -d android-src
          PROJECT="android-src/OnlineGames-Android-TWA"
          test -f "$PROJECT/app/build.gradle"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-src/OnlineGames-Android-TWA/app/build.gradle')
          s = p.read_text()
          import re
          pattern = r"applicationId\s+['\"]com\.onlinegames\.[^'\"]+['\"]"
          s2, n = re.subn(pattern, "applicationId 'com.onlinegames.official'", s)
          if n == 0:
              raise SystemExit('Could not find applicationId declaration in app/build.gradle')
          p.write_text(s2)
          print('Enforced applicationId com.onlinegames.official')
          PY
          grep -q "applicationId 'com.onlinegames.official'" "$PROJECT/app/build.gradle"

      - name: Build release AAB
        run: gradle -p android-src/OnlineGames-Android-TWA bundleProductionRelease

      - name: Build diagnostic APK (separate package)
        run: gradle -p android-src/OnlineGames-Android-TWA assembleDiagnosticDebug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-Diagnostic-APK
          path: android-src/OnlineGames-Android-TWA/app/build/outputs/apk/diagnostic/debug/*.apk
          if-no-files-found: error

      - name: Verify AAB package ID
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find android-src/OnlineGames-Android-TWA/app/build/outputs/bundle -type f -name '*.aab' | grep -v diagnostic | head -n 1)"
          test -n "$AAB"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --module=base > "$RUNNER_TEMP/manifest.xml"
          grep -q 'package="com.onlinegames.official"' "$RUNNER_TEMP/manifest.xml" || {
            echo 'ERROR: AAB package ID is not com.onlinegames.official'
            cat "$RUNNER_TEMP/manifest.xml"
            exit 1
          }
          echo 'Verified AAB package ID: com.onlinegames.official'

      - name: Sign AAB
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          AAB="$(find android-src/OnlineGames-Android-TWA/app/build/outputs/bundle -type f -name '*.aab' | grep -v diagnostic | head -n 1)"
          jarsigner -keystore "$RUNNER_TEMP/upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          mkdir -p signed
          cp "$AAB" signed/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB-signed
          path: signed/app-release.aab
          if-no-files-found: error
