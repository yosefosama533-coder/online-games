
name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OnlineGames-Android-TWA-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found: $SDKMANAGER"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q OnlineGames-Android-TWA-project.zip -d android-src

      - name: Verify Android project
        run: |
          test -f android-src/OnlineGames-Android-TWA/settings.gradle || \
          test -f android-src/OnlineGames-Android-TWA/settings.gradle.kts

      - name: Build release AAB
        run: |
          gradle -p android-src/OnlineGames-Android-TWA bundleRelease

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB-unsigned
          path: android-src/OnlineGames-Android-TWA/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
