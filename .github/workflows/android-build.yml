
name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OnlineGames-Android-TWA-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q OnlineGames-Android-TWA-project.zip -d android-src

      - name: Find Android project and build AAB
        shell: bash
        run: |
          set -e
          SETTINGS_FILE=$(find android-src -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file was not found."
            find android-src -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android project: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" bundleRelease

          mkdir -p dist
          AAB_FILE=$(find "$PROJECT_DIR" -type f -path '*/outputs/bundle/release/*.aab' -print -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB file was not generated."
            exit 1
          fi

          cp "$AAB_FILE" dist/Online-Games.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB
          path: dist/Online-Games.aab
          if-no-files-found: error
