name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OnlineGames-Android-TWA-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -q OnlineGames-Android-TWA-project.zip -d android-src

      - name: Fix Android minimum SDK compatibility
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="android-src/OnlineGames-Android-TWA"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle was not found at $APP_GRADLE"
            echo "Extracted files:"
            find android-src -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "Before fix:"
          grep -nE 'minSdk|androidbrowserhelper' "$APP_GRADLE" || true
          if grep -qE 'minSdk[[:space:]]+23([[:space:]]|$)' "$APP_GRADLE"; then
            sed -i -E 's/minSdk[[:space:]]+23([[:space:]]|$)/minSdk 24\1/' "$APP_GRADLE"
          fi
          if ! grep -qE 'minSdk[[:space:]]+([2-9][4-9]|[3-9][0-9])([[:space:]]|$)' "$APP_GRADLE"; then
            echo "ERROR: minSdk is still below 24 or could not be verified."
            exit 1
          fi
          echo "After fix:"
          grep -nE 'minSdk|androidbrowserhelper' "$APP_GRADLE"

      - name: Build release AAB
        run: gradle -p android-src/OnlineGames-Android-TWA bundleRelease

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB-unsigned
          path: android-src/OnlineGames-Android-TWA/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
