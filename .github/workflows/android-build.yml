
name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OnlineGames-Android-TWA-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          unzip -q OnlineGames-Android-TWA-project.zip -d android-src
          PROJECT_DIR="android-src/OnlineGames-Android-TWA"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Android project folder was not found."
            find android-src -maxdepth 3 -type d | sort
            exit 1
          fi

      - name: Prepare signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Missing GitHub secret: $name"
              exit 1
            fi
          done

          mkdir -p android-src/OnlineGames-Android-TWA/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > android-src/OnlineGames-Android-TWA/keystore/online-games-upload.jks

          keytool -list \
            -keystore android-src/OnlineGames-Android-TWA/keystore/online-games-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"

      - name: Configure Android release signing
        shell: bash
        run: |
          set -euo pipefail

          cat > android-src/OnlineGames-Android-TWA/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.onlinegames.yousef'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.onlinegames.yousef'
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName '1.0.0'
              }

              signingConfigs {
                  release {
                      storeFile file("${rootProject.projectDir}/keystore/online-games-upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.8.0'
          }
          EOF

      - name: Build signed release AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -p android-src/OnlineGames-Android-TWA bundleRelease

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="android-src/OnlineGames-Android-TWA/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB was not generated."
            find android-src/OnlineGames-Android-TWA/app/build/outputs -type f || true
            exit 1
          fi
          jarsigner -verify "$AAB"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB-signed
          path: android-src/OnlineGames-Android-TWA/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
