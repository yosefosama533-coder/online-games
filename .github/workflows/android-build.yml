name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OnlineGames-Android-TWA-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the Android command-line tools already present on GitHub's Ubuntu runner.
      # Do not use android-actions/setup-android@v3 here.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "ANDROID_HOME=${ANDROID_HOME}"
            find "${ANDROID_HOME}" -maxdepth 4 -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          unzip -q OnlineGames-Android-TWA-project.zip -d android-src
          PROJECT_DIR="android-src/OnlineGames-Android-TWA"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Android project folder was not found."
            echo "Extracted folders:"
            find android-src -maxdepth 3 -type d | sort
            exit 1
          fi

      - name: Fix Android minimum SDK compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE="android-src/OnlineGames-Android-TWA/app/build.gradle"
          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle was not found: $APP_GRADLE"
            find android-src -maxdepth 5 -type f | sort
            exit 1
          fi
          echo "Android SDK settings before adjustment:"
          grep -nE 'minSdk|androidbrowserhelper' "$APP_GRADLE" || true
          if grep -qE 'minSdk[[:space:]]+23([[:space:]]|$)' "$APP_GRADLE"; then
            sed -i -E 's/minSdk[[:space:]]+23([[:space:]]|$)/minSdk 24\1/' "$APP_GRADLE"
          fi
          if ! grep -qE 'minSdk[[:space:]]+24([[:space:]]|$)' "$APP_GRADLE"; then
            echo "ERROR: Could not verify minSdk 24 in app/build.gradle."
            exit 1
          fi
          echo "Android SDK settings after adjustment:"
          grep -nE 'minSdk|androidbrowserhelper' "$APP_GRADLE"

      - name: Build release AAB
        shell: bash
        run: |
          set -e
          gradle -p android-src/OnlineGames-Android-TWA bundleRelease

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB-unsigned
          path: android-src/OnlineGames-Android-TWA/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
