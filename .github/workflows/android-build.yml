name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -euo pipefail

          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"

          mv "$RUNNER_TEMP/android-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$PROJECT_ZIP" ]; then
            echo "::error::No project ZIP found in the repository root. Upload OnlineGames-Android-TWA-project-fixed-v6(1).zip to the repository root."
            exit 1
          fi

          echo "Using project archive: $PROJECT_ZIP"
          unzip -q "$PROJECT_ZIP" -d android-src

          test -f android-src/OnlineGames-Android-TWA/app/build.gradle
          test -f android-src/OnlineGames-Android-TWA/settings.gradle

      - name: Verify Android project configuration
        run: |
          set -euo pipefail
          grep -q "androidx.appcompat:appcompat:1.7.0" android-src/OnlineGames-Android-TWA/app/build.gradle
          grep -q "Theme.AppCompat.Light.NoActionBar" android-src/OnlineGames-Android-TWA/app/src/main/res/values/styles.xml
          grep -q "applicationId 'com.onlinegames.official'" android-src/OnlineGames-Android-TWA/app/build.gradle

      - name: Build release AAB
        run: gradle -p android-src/OnlineGames-Android-TWA bundleRelease

      - name: Verify package ID
        run: |
          set -euo pipefail
          AAB="$(find android-src/OnlineGames-Android-TWA/app/build/outputs/bundle -name '*.aab' -print -quit)"
          test -n "$AAB"

          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar

          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle="$AAB" --module=base > "$RUNNER_TEMP/manifest.xml"

          grep -q 'package="com.onlinegames.official"' "$RUNNER_TEMP/manifest.xml"

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"

          AAB="$(find android-src/OnlineGames-Android-TWA/app/build/outputs/bundle -name '*.aab' -print -quit)"
          jarsigner \
            -keystore "$RUNNER_TEMP/upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

          jarsigner -verify "$AAB"
          mkdir -p signed
          cp "$AAB" signed/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB-signed
          path: signed/app-release.aab
          if-no-files-found: error
