
name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'OnlineGames-Android-TWA-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK manually
        run: |
          set -euo pipefail

          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"

          mv "$RUNNER_TEMP/android-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: unzip -q OnlineGames-Android-TWA-project.zip -d android-src

      - name: Verify required Android theme dependency
        run: |
          grep -q "androidx.appcompat:appcompat:1.7.0" android-src/OnlineGames-Android-TWA/app/build.gradle
          grep -q "Theme.AppCompat.Light.NoActionBar" android-src/OnlineGames-Android-TWA/app/src/main/res/values/styles.xml

      - name: Build release AAB
        run: gradle -p android-src/OnlineGames-Android-TWA bundleRelease

      - name: Verify package ID
        run: |
          AAB=$(find android-src/OnlineGames-Android-TWA/app/build/outputs/bundle -name '*.aab' -print -quit)
          test -n "$AAB"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --module=base > "$RUNNER_TEMP/manifest.xml"
          grep -q 'package="com.onlinegames.official"' "$RUNNER_TEMP/manifest.xml"

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          AAB=$(find android-src/OnlineGames-Android-TWA/app/build/outputs/bundle -name '*.aab' -print -quit)
          jarsigner -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          mkdir -p signed
          cp "$AAB" signed/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Online-Games-AAB-signed
          path: signed/app-release.aab
          if-no-files-found: error
